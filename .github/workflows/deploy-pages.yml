name: Deploy articles bubble to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancelling in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build articles bubble
        run: npm run build --workspace=@copilot-ledger/articles

      - name: Check out Agentviz Studio
        uses: actions/checkout@v4
        with:
          repository: Jfhelin/agentviz-studio
          ref: b1c950fad4b3b12cf3aec0d6c0a4b078029f2fe5
          path: agentviz-studio
          persist-credentials: false

      - name: Install Agentviz Studio dependencies
        working-directory: agentviz-studio
        run: npm ci

      - name: Build static Agentviz Studio
        working-directory: agentviz-studio
        env:
          VITE_BASE_PATH: /copilot-ledger/agentviz/
        run: npm run build:viewer

      - name: Add Agentviz Studio to Pages artifact
        run: cp -R agentviz-studio/dist-viewer packages/articles/dist/agentviz

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/articles/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
