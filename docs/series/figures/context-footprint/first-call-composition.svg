<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 470" width="100%" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="t">Where the first-call tokens go</title>
  <desc id="d">Stacked bars showing the composition of each first request. Copilot CLI about 14,877 tokens: system 6,657, tools 8,064, user plus history 156. Claude CLI about 27,217: system 7,015, tools 18,877, skill catalog about 1,094, remainder about 231. Copilot in VS Code 20,598: tool definitions about 16,622 plus a single opaque block of about 3,976 for system, skills and workspace context that the export does not separate. In all three the tool definitions are the largest single component (54.2 percent, 69.4 percent, and about 81 percent respectively); the user message is among the smallest parts.</desc>
  <rect x="0" y="0" width="1010" height="470" fill="#ffffff"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#24292f">Tool definitions dominate every prefix</text>
  <text x="40" y="66" font-size="13" fill="#57606a">First-call composition in shape tokens. CLI splits read from the request body; VS Code's split is not separable in the export.</text>
  <g><rect x="210.0" y="104" width="137.0" height="40" fill="#0969da"/><rect x="347.0" y="104" width="165.9" height="40" fill="#8250df"/><rect x="512.9" y="104" width="3.2" height="40" fill="#1a7f37"/><text x="208" y="129" text-anchor="end" font-size="13" fill="#57606a">Copilot CLI</text><text x="528.1" y="129" font-size="13" font-weight="700" fill="#24292f">~14.9k</text><rect x="210.0" y="170" width="144.3" height="40" fill="#0969da"/><rect x="354.3" y="170" width="388.4" height="40" fill="#8250df"/><rect x="742.7" y="170" width="22.5" height="40" fill="#bf8700"/><rect x="765.2" y="170" width="4.8" height="40" fill="#1a7f37"/><text x="208" y="195" text-anchor="end" font-size="13" fill="#57606a">Claude CLI</text><text x="782.0" y="195" font-size="13" font-weight="700" fill="#24292f">~27.2k</text><rect x="210.0" y="236" width="81.8" height="40" fill="#afb8c1"/><rect x="291.8" y="236" width="342.0" height="40" fill="#8250df"/><text x="208" y="261" text-anchor="end" font-size="13" fill="#57606a">Copilot in VS Code</text><text x="645.8" y="261" font-size="13" font-weight="700" fill="#24292f">~20.6k</text></g>
  <line x1="210" y1="302" x2="770" y2="302" stroke="#d0d7de" stroke-width="1"/>
  <text x="490" y="316" font-size="11.5" fill="#57606a" text-anchor="middle">Values in legend: Copilot CLI · Claude CLI · Copilot in VS Code.</text>
  <g><rect x="40" y="322" width="13" height="13" rx="2" fill="#0969da"/><text x="60" y="333" font-size="12.5" fill="#24292f">System instructions <tspan fill="#57606a">— 6,657 · 7,015 · folded</tspan></text><rect x="510" y="322" width="13" height="13" rx="2" fill="#8250df"/><text x="530" y="333" font-size="12.5" fill="#24292f">Tool definitions <tspan fill="#57606a">— 8,064 · 18,877 · ~16,622</tspan></text><rect x="40" y="346" width="13" height="13" rx="2" fill="#bf8700"/><text x="60" y="357" font-size="12.5" fill="#24292f">Skill catalog <tspan fill="#57606a">— 0 · ~1,094 · folded</tspan></text><rect x="510" y="346" width="13" height="13" rx="2" fill="#1a7f37"/><text x="530" y="357" font-size="12.5" fill="#24292f">User + history <tspan fill="#57606a">— 156 · ~231 · —</tspan></text><rect x="40" y="370" width="13" height="13" rx="2" fill="#afb8c1"/><text x="60" y="381" font-size="12.5" fill="#24292f">System + context (not separable) <tspan fill="#57606a">— — · — · ~3,976</tspan></text></g>
  <text x="40" y="440" font-size="11" fill="#8c959f">Tool definitions are the largest block everywhere: 54.2% of Copilot CLI, 69.4% of Claude CLI, ~81% of the measurable VS Code total.</text>
  <text x="40" y="456" font-size="11" fill="#8c959f">VS Code folds system, skills, and workspace context into one opaque block; it is shown as a single grey segment rather than guessed.</text>
</svg>