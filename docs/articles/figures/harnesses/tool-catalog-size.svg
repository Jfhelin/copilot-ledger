<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="100%" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">Tool catalogs are part of the prompt</title>
  <desc id="desc">Horizontal bar chart of tool catalog size: Copilot CLI about 8.1k tokens across 19 tools, Claude CLI about 18.9k tokens across 27 tools.</desc>

  <rect x="0" y="0" width="760" height="290" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#24292f">Tool catalogs are part of the prompt</text>
  <text x="40" y="64" font-size="13" fill="#57606a">More detailed tool descriptions can help tool use, but they also grow the repeated prefix.</text>

  <!-- scale max 20000 over 480px from x=180 -->
  <g font-size="13" fill="#24292f">
    <!-- Copilot CLI 8064 -> 194 -->
    <text x="168" y="137" text-anchor="end" fill="#57606a">Copilot CLI</text>
    <rect x="180" y="116" width="194" height="40" rx="5" fill="#0969da"/>
    <text x="384" y="141" font-weight="700">~8.1k tokens · 19 tools</text>

    <!-- Claude CLI 18877 -> 453 -->
    <text x="168" y="202" text-anchor="end" fill="#57606a">Claude CLI</text>
    <rect x="180" y="181" width="453" height="40" rx="5" fill="#0969da"/>
    <text x="180" y="206" font-weight="700" fill="#ffffff" dx="10">~18.9k tokens · 27 tools</text>
  </g>

  <line x1="180" y1="240" x2="660" y2="240" stroke="#d0d7de" stroke-width="1"/>
  <text x="420" y="264" font-size="12" fill="#57606a" text-anchor="middle">Tool catalog size (tokens)</text>
</svg>
