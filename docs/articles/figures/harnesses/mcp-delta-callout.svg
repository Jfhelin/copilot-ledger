<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="100%" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">One MCP server adds tools and prefix tokens</title>
  <desc id="desc">A callout card: adding one filesystem MCP server added 14 tools and 1,876 prefix tokens. MCP adds capability, but also changes what the model sees.</desc>

  <rect x="0" y="0" width="560" height="300" fill="#ffffff"/>
  <rect x="20" y="20" width="520" height="260" rx="14" fill="#f6f8fa" stroke="#d0d7de"/>
  <rect x="20" y="20" width="6" height="260" rx="3" fill="#8250df"/>

  <text x="52" y="62" font-size="13" letter-spacing="0.10em" fill="#57606a">ADDING ONE MCP SERVER</text>

  <text x="52" y="128" font-size="44" font-weight="800" fill="#0969da">+14 tools</text>
  <text x="52" y="190" font-size="44" font-weight="800" fill="#8250df">+1,876 prefix tokens</text>

  <text x="52" y="224" font-size="14" fill="#57606a">From one filesystem MCP server</text>
  <text x="52" y="258" font-size="13" fill="#24292f">MCP adds capability, but also changes what the model sees.</text>
</svg>
