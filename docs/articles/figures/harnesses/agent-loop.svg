<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 730" width="100%" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">The agent works in a loop</title>
  <desc id="desc">A circular flow: the model decides, the harness executes a tool, the result is returned to the model, and the loop repeats until the task is complete or the session ends.</desc>
  <defs>
    <marker id="loopArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="730" fill="#ffffff"/>

  <!-- Heading -->
  <text x="500" y="50" font-size="30" font-weight="700" fill="#24292f" text-anchor="middle">The agent works in a loop</text>
  <text x="500" y="82" font-size="16" fill="#57606a" text-anchor="middle">The harness orchestrates each step.</text>

  <!-- Curved connectors (clockwise around the center) -->
  <path d="M 648 232 Q 788 330 706 440" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#loopArrow)"/>
  <path d="M 598 598 Q 500 656 402 598" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#loopArrow)"/>
  <path d="M 294 440 Q 212 330 352 232" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#loopArrow)"/>

  <!-- Connector labels -->
  <g font-size="16" fill="#57606a">
    <text x="816" y="346">Model requests</text>
    <text x="816" y="368">action using a tool</text>
    <text x="500" y="678" text-anchor="middle">Tool executes and produces an output</text>
    <text x="184" y="346" text-anchor="end">Output is returned</text>
    <text x="184" y="368" text-anchor="end">to the model</text>
  </g>

  <!-- Center: repeat -->
  <circle cx="500" cy="404" r="78" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="5 7"/>
  <g stroke="#57606a" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M 484 366 A 18 18 0 1 1 480 386"/>
  </g>
  <path d="M 478 360 L 487 366 L 477 374 z" fill="#57606a"/>
  <g font-size="15" fill="#57606a" text-anchor="middle">
    <text x="500" y="416">Repeat until the</text>
    <text x="500" y="435">task is complete</text>
    <text x="500" y="454">or the session ends.</text>
  </g>

  <!-- 1. Model decides (top, purple) -->
  <rect x="350" y="90" width="300" height="150" rx="14" fill="#fbefff" stroke="#8250df" stroke-width="1.5"/>
  <!-- brain icon (two closed lobes + seam), narrow and tall -->
  <g fill="none" stroke="#8250df" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 392 126 C 382 124 374 130 374 141 C 366 142 362 151 367 161 C 360 167 360 180 368 186 C 366 198 376 203 383 196 C 386 204 390 202 392 196 Z"/>
    <path d="M 392 126 C 402 124 410 130 410 141 C 418 142 422 151 417 161 C 424 167 424 180 416 186 C 418 198 408 203 401 196 C 398 204 394 202 392 196 Z"/>
    <path d="M 374 141 C 380 150 380 163 374 171"/>
    <path d="M 410 141 C 404 150 404 163 410 171"/>
  </g>
  <text x="450" y="138" font-size="18" font-weight="700" fill="#8250df">1.  Model decides</text>
  <g font-size="14" fill="#24292f">
    <text x="450" y="166">The model looks at the</text>
    <text x="450" y="187">conversation and decides</text>
    <text x="450" y="208">what to do next.</text>
  </g>

  <!-- 2. Harness executes a tool (bottom-right, blue) -->
  <rect x="571" y="445" width="300" height="150" rx="14" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <rect x="600" y="488" width="50" height="44" rx="7" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <path d="M 612 502 l 9 8 l -9 8" fill="none" stroke="#0969da" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="628" y1="520" x2="640" y2="520" stroke="#0969da" stroke-width="2.5" stroke-linecap="round"/>
  <text x="676" y="486" font-size="18" font-weight="700" fill="#0969da">2.  Harness executes</text>
  <text x="676" y="508" font-size="18" font-weight="700" fill="#0969da">     a tool</text>
  <g font-size="14" fill="#24292f">
    <text x="676" y="536">The harness runs the</text>
    <text x="676" y="557">requested tool or action</text>
    <text x="676" y="578">in the environment.</text>
  </g>

  <!-- 3. Result returned (bottom-left, green) -->
  <rect x="129" y="445" width="300" height="150" rx="14" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <g fill="none" stroke="#1a7f37" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 158 488 h 30 l 12 12 v 40 h -42 z"/>
    <path d="M 188 488 v 12 h 12"/>
    <line x1="166" y1="512" x2="192" y2="512"/>
    <line x1="166" y1="524" x2="192" y2="524"/>
  </g>
  <text x="222" y="486" font-size="18" font-weight="700" fill="#1a7f37">3.  Result returned</text>
  <g font-size="14" fill="#24292f">
    <text x="222" y="514">The output from the tool</text>
    <text x="222" y="535">is returned to the model</text>
    <text x="222" y="556">as new context.</text>
  </g>
</svg>
