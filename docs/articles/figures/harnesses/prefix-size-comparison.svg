<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="100%" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="title">What the model sees before it starts</title>
  <desc id="desc">Horizontal bar chart comparing pre-reasoning prefix size: Copilot CLI about 15k tokens, Claude CLI about 27k tokens, and Claude Code in VS Code about 46k tokens.</desc>

  <rect x="0" y="0" width="760" height="340" fill="#ffffff"/>
  <text x="40" y="40" font-size="20" font-weight="700" fill="#24292f">What the model sees before it starts</text>
  <text x="40" y="64" font-size="13" fill="#57606a">Same model, same task shape, different harness context.</text>

  <!-- bars: scale max 50000 over 480px from x=220 -->
  <g font-size="13" fill="#24292f">
    <!-- Copilot CLI 15000 -> 144 -->
    <text x="208" y="137" text-anchor="end" fill="#57606a">Copilot CLI</text>
    <rect x="220" y="116" width="144" height="40" rx="5" fill="#0969da"/>
    <text x="374" y="141" font-weight="700" fill="#24292f">~15k</text>

    <!-- Claude CLI 27000 -> 259 -->
    <text x="208" y="202" text-anchor="end" fill="#57606a">Claude CLI</text>
    <rect x="220" y="181" width="259" height="40" rx="5" fill="#0969da"/>
    <text x="489" y="206" font-weight="700" fill="#24292f">~27k</text>

    <!-- Claude Code in VS Code 46400 -> 445 -->
    <text x="208" y="267" text-anchor="end" fill="#57606a">Claude Code in VS Code</text>
    <rect x="220" y="246" width="445" height="40" rx="5" fill="#8250df"/>
    <text x="675" y="271" font-weight="700" fill="#24292f">~46k</text>
  </g>

  <line x1="220" y1="300" x2="700" y2="300" stroke="#d0d7de" stroke-width="1"/>
  <text x="460" y="324" font-size="12" fill="#57606a" text-anchor="middle">Prefix tokens (before reasoning)</text>
</svg>
